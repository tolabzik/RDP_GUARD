name: Test and build Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q --junitxml=test-results/pytest.xml
        env:
          RDP_GUARD_NATIVE_TESTS: ${{ runner.os == 'Windows' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ runner.os }}
          path: test-results/

  windows-package:
    timeout-minutes: 20
    needs: tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[build,test]"
      - name: Resolve package version
        id: package
        shell: pwsh
        run: |
          $Version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.0-rc.5' }
          if ($Version -notmatch '^\d+\.\d+\.\d+(-[A-Za-z0-9.]+)?$') { throw 'Invalid release tag.' }
          "version=$Version" >> $env:GITHUB_OUTPUT
      - name: Build Windows x64 distribution
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: ./scripts/Build.ps1 -Version $env:PACKAGE_VERSION
      - name: Install and test frozen services on isolated Windows Server runner
        shell: powershell
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $Staging = "dist/RDPGuard-$env:PACKAGE_VERSION-win-x64"
          Copy-Item scripts/Test-Installed.ps1,scripts/test_installed.py $Staging
          & "$Staging/Test-Installed.ps1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-service-logs
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: RDPGuard-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RDPGuard-windows-x64
          path: release
      - name: Publish tested binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --title "RDP Guard $RELEASE_TAG" --prerelease --notes-file docs/RELEASE_NOTES.md
