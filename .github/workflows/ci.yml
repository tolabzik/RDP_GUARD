name: Test and build Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q --junitxml=test-results/pytest.xml
        env:
          RDP_GUARD_NATIVE_TESTS: ${{ runner.os == 'Windows' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ runner.os }}
          path: test-results/

  windows-package:
    needs: tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[build,test]"
      - name: Build Windows x64 distribution
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Install and test frozen services on isolated Windows Server runner
        shell: powershell
        run: |
          Copy-Item scripts/Test-Installed.ps1,scripts/test_installed.py dist/RDPGuard-1.0.0-rc.1-win-x64
          & dist/RDPGuard-1.0.0-rc.1-win-x64/Test-Installed.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-service-logs
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: RDPGuard-1.0.0-rc.1-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RDPGuard-1.0.0-rc.1-win-x64
          path: release
      - name: Publish tested binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --title "RDP Guard $RELEASE_TAG" --prerelease --notes-file docs/RELEASE_NOTES.md
