[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdp-guard"
version = "1.0.0rc1"
description = "Local Windows RDP authentication monitoring and scoped firewall protection"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1.6,<4",
  "argon2-cffi>=23.1,<26", "defusedxml>=0.7.1,<1", "psutil>=6,<8",
  "pywin32>=310; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
build = ["pyinstaller>=6.12,<7"]

[project.scripts]
rdpguard = "rdp_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rdp_guard = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["windows: native Windows integration tests (isolated host only)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
