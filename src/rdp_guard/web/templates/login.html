<!doctype html>
<html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход · RDP Guard</title><link rel="stylesheet" href="/static/style.css"><script src="/static/login.js" defer></script></head>
<body class="login-page"><main class="login-card"><div class="brand-mark">RG</div><p class="eyebrow">LOCAL SECURITY CONSOLE</p>
<h1>RDP Guard</h1><p class="muted">Управление защитой этого сервера</p>
<form id="login-form"><label>Администратор панели<input name="username" autocomplete="username" required maxlength="64" autofocus></label>
<label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
<button class="primary" type="submit">Войти в панель <span>→</span></button></form>
<p id="error" role="alert"></p><div class="login-footer"><span class="dot"></span> Только 127.0.0.1:8787 · Доступ по учётной записи</div>
</main></body></html>
